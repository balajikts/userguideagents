[project]
name = "electronics-guide-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "autogen-agentchat>=0.7,<0.8",
  "autogen-ext[openai]>=0.7,<0.8",
  "anthropic>=1.11",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "redis>=5",
  "chromadb>=1.5,<2",
  # autogen-core pins protobuf 5.29; newer googleapis-common-protos (pulled in by
  # chromadb's OpenTelemetry) ship protobuf-6 generated code that fails to import on 5.29.
  "protobuf~=5.29.3",
  "googleapis-common-protos<=1.75.0",
  "fastembed>=0.4",
  "pypdf>=4",
]

[project.optional-dependencies]
# Production vector store (VECTOR_STORE=pgvector); also in requirements-prod.txt.
pgvector = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3"]
ui = ["streamlit>=1.40", "httpx>=0.27"]
evals = ["langsmith>=0.2", "langchain-core>=0.3", "langchain-anthropic>=0.3", "langchain-openai>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "fakeredis>=2.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
